name: Diseños del día

on:
  schedule:
    - cron: "0 12 * * *"   # 6:00 am hora del centro de México
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar diseños
        run: python scripts/fetch.py

      - name: Guardar resultados
        run: |
          git config user.name "makerworld-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feed.json data/seen.json docs/data/state.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Diseños del $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
